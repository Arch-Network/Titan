name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test (including doctests)
        run: cargo test --locked --workspace

  node:
    name: TypeScript (ts-sdk, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ts-sdk/package-lock.json
            tests/package-lock.json

      # tests depends on ../ts-sdk (file: dependency), so the SDK is installed first.
      - name: Install ts-sdk dependencies
        working-directory: ts-sdk
        run: npm ci

      - name: Lint ts-sdk (type-check)
        working-directory: ts-sdk
        run: npm run lint

      - name: Build ts-sdk
        working-directory: ts-sdk
        run: npm run build

      - name: Install tests dependencies
        working-directory: tests
        run: npm ci

      - name: Lint tests (type-check)
        working-directory: tests
        run: npm run lint
